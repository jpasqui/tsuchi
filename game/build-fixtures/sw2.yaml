# game/fixtures.yaml's entries with Pikmin 4 Ver. 2.0.0's Switch 2 Edition numbers (build D3A41765), for
# tools/stage_test_mods.py --build sw2. Nothing here reaches the module people run.

data:
  tick_state_actor_table: 0x0786A0E0 # GActor's table (its constructor 0x5D2BD0 stores it; the demo's 0x5AB050 stores 0x7837EE0)

constants:
  ai_order_placement: 0x123456789abcddb3 # Authored placement-list larva used by the SDK proof.
  # The cosine/sine import veneers (0x5BAABB0, 0x5BAABA0): the demo's shape, GOT 0x7F421C0/0x7F421B8.
  native_hook_branch_offset: 12
  native_hook_cos_0: 0x90011CD0
  native_hook_cos_1: 0xF940E211
  native_hook_cos_2: 0x91070210
  native_hook_cos_3: 0xD61F0220
  native_hook_sin_0: 0x90011CD0
  native_hook_sin_1: 0xF940DE11
  native_hook_sin_2: 0x9106E210
  native_hook_sin_3: 0xD61F0220

assets:
  tick_state_actor: /Game/Carrot4/Placeables/Teki/GKochappy.GKochappy_C
  cleanup_material: /Engine/EngineMaterials/DefaultMaterial.DefaultMaterial
  ai_order_map: /Game/Carrot4/Maps/Madori/Cave/Cave000/Cave000_F00/Cave000_F00_P
  ai_order_class: /Game/Carrot4/Placeables/Teki/GBaby.GBaby_C

structs:
  ai_start_observation:              # BabyAI start 0x2F17AC0 reads the demo's offsets (0x208, 0x218, 0xF50, 0x98, 0x30)
    fields: {game_owner: 0x208, territory: 0x82C, patrol: 0xF50, actions: 0x218, tree_context: 0x98, patrol_reference: 0x30}

functions:
  actor_request_tick: {address: 0x03570DF0, args: [pointer, bool]} # GActor's table +0x698, as the demo's 0x355BB10
