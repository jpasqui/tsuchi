# What a native route's handler finds where, by route: register numbers, and offsets from the stack pointer
# where the route's stack is read. Another compiler can put these elsewhere, so each is per build.
# A number in a route's frame is a register, unless it is listed here as an offset from the stack.
route_frame_offsets: [cursor_written.saved_widget, cursor_written.saved_component, cursor_written.saved_return, cursor_written.projected, cursor_written.frame_end]
# Fields that name a general register as 0-30 or a vector register as 32-63.
route_frame_either: [particle_sprite.z]
# Fields a handler asks t::present about, so that a build may lack them while the route stays.
route_frame_optional: [cursor_written.saved_widget, cursor_written.saved_component, cursor_written.saved_return]

