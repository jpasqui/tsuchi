# Assets of the game's own that the framework loads, by their paths.
assets:
  options_button_class: /Game/Carrot4/UI/Common/Button/WBP_ui_PA_Button_Menu.WBP_ui_PA_Button_Menu_C  # an entry of the title's Options menu
  host_page_class: /Game/Carrot4/UI/OutGame/Information/WBP_ui_Information.WBP_ui_Information_C   # Tsuchi's host: the frame
  host_line_class: /Game/Carrot4/UI/OutGame/Information/Parts/WBP_ui_Info_PA_Text.WBP_ui_Info_PA_Text_C  # its lines of text
  title_button_class: /Game/Carrot4/UI/OutGame/Title/Parts/WBP_ui_PA_Title_Button.WBP_ui_PA_Title_Button_C  # one entry of the title menu
  ui_mod_list_tab_class: /Game/Carrot4/UI/InGame/Tablet/Parts/WBP_ui_Tablet_PA_Tab_Item.WBP_ui_Tablet_PA_Tab_Item_C
  pikmin_property_table: /Game/Carrot4/Core/GActor/DT_PikminProperty.DT_PikminProperty
  pikmin_color_enum: /Script/Carrot4.EPikminColor
  area_bases_table: "/Game/Carrot4/GameScene/PrimaryDataAssets/DT_AreaBaseCampTransition.DT_AreaBaseCampTransition"
  treasure_table: /Game/Carrot4/Core/GActor/DT_OtakaraParameter.DT_OtakaraParameter      # a row for each treasure: its worth and its carriers
  treasure_catalog_table: /Game/Carrot4/Placeables/Zukan/DT_ZukanOtakaraParameter.DT_ZukanOtakaraParameter  # a row for each treasure the Piklopedia lists
  catalog_class_table: /Game/Carrot4/Placeables/Zukan/DT_ZukanBP.DT_ZukanBP              # the class the Piklopedia shows for a creature or a treasure
  icon_table: /Game/Carrot4/Core/GActor/DT_ActorTexture.DT_ActorTexture                  # the icon of a creature or a treasure
  # a row for each creature: its life, its worth and its carriers. A creature that differs at night has a second row, under its name and `_NIGHT`
  creature_table: /Game/Carrot4/Core/GActor/DT_TekiParameter.DT_TekiParameter
  creature_catalog_table: /Game/Carrot4/Placeables/Zukan/DT_ZukanTekiParameter.DT_ZukanTekiParameter  # a row for each creature the Piklopedia lists: the actors it puts on its stage
  # What the list of areas and the radar show. A row for each area: the pictures the list shows beside it.
  area_pictures_table: /Game/Carrot4/Core/UI/FastTravel/DT_FastTravelSlideShow.DT_FastTravelSlideShow
  # A row for each area: its place in the list, the types of Pikmin the list shows for it, and a number for each of its nights.
  area_types_table: /Game/Carrot4/Core/UI/FastTravel/DT_FastTravelInfo.DT_FastTravelInfo
  # A row for each area's number, in the order of the numbers: the name of the area's level, and three totals.
  area_totals_table: /Game/Carrot4/Core/UI/DT_UIMoveArea.DT_UIMoveArea
  # A row for each scene: the picture the radar draws there, and where the world lies on it.
  radar_table: /Game/Carrot4/Core/UI/DT_UIRadarTextureParameter.DT_UIRadarTextureParameter
  # The messages the list of areas shows under an area by day, each with the areas it is for.
  area_message_table: /Game/Carrot4/Core/UI/DT_UIMoveAreaDayMessage.DT_UIMoveAreaDayMessage

# Rows of the game's own tables that the framework asks for by name.
  treasure_series_table: /Game/Carrot4/Core/UI/DT_OtakaraSeriesParameter.DT_OtakaraSeriesParameter
rows:
  pikmin_properties: [Red, Blue, Yellow, Rock, Wing, Purple, White, Ice]
  # In the table of the list's messages by day: one row of each kind of message the game shows for every area of
  # its own. A new area's messages are copies of these.
  area_messages: [AreaSelect_Common_IncreasePikmin_00, AreaSelect_Common_CollectPikmin_00, AreaSelect_Common_OpenCamp_00,
                  AreaSelect_Common_CollectOnyon_00, AreaSelect_Common_Rescue_00, AreaSelect_Common_CollectOtakara_00,
                  AreaSelect_Common_Complete_00]

structs:
  options_button: {fields: {look: 0x4D8, look_bytes: 0x15}}   # a menu button's ButtonSize, text place and PresetType (MenuButtonWidget)
  options_presenter: {fields: {input: 0x78, view: 0x80}}   # the title's Options menu presenter: its input map and its widget
  options_view: {fields: {state: 0x4D8, buttons: 0x4F8, count: 0x500, room: 0x504, selected: 0x508}}  # its widget
  title_flow: {fields: {state: 0xD8, answered: 0xE8, answer: 0xEC}}   # the title's state machine: its state, and the dialog's answer
  dialog_result: {size: 0x50, fields: {self: 0x18, header: 0x28, message: 0x38, dialog_kind: 0x3C, as_flow: 0x4D}}
  # The title presenter: the selected entry, its widget, its input map and its state (0 to 3 the opening and
  # Press Start, 4 the menu coming in, 5 the menu, 9 and 10 a choice being carried out).
  title_presenter: {fields: {cursor: 0x80, view: 0x88, input: 0xA8, state: 0xB0}}
  # The pause menu's presenter: its widget. The title's Options menu opens Controls and the guide through it.
  game_menu_presenter: {fields: {view: 0x90}}
  presenter_table:                  # entries in a presenter's function table
    fields: {reset: {at: 0x310, args: [pointer, u32]}}   # (presenter, 0): closes it and clears what an earlier page left
  # The title widget: the line under the menu, its list of buttons, the button count without a hidden last
  # entry (bit 0 of hide), and which entry is hidden (hidden, or hidden_other when hidden_select is set).
  title_view: {fields: {description: 0x560, buttons: 0x568, count: 0x570, room: 0x574, hidden_select: 0x5AB, hide: 0x5AC, hidden: 0x5B0, hidden_other: 0x5B4}}
