# Places inside a function where the framework reads or changes the registers, with every register kept.
native_routes:
  # FPackageStore container callback, under PackageNameMapsCritical. x8 is the global entry
  # pointer slot (package ID at x8-8); x24 is this container's 32-byte store entry.
  package_store_entry: {address: 0x382D8D8, instruction: 0xF9400109, resume: false}
  # Settings input has passed the native owning-context, state and consumed gates.
  ui_settings_dispatch: {address: 0x247006c, instruction: 0x7100069f, resume: false}
  # UpdatePrimitiveTransform's task is filled in and not yet published: x20 holds it.
  scene_publish: {address: 0x045704F4, instruction: 0xB0024189, resume: false}
  # A sprite particle's vertices: x28 is the particle, its location loaded into d3 and w8, its old location into d1 and s2.
  particle_sprite: {address: 0x057B435C, instruction: 0x36002B69, resume: false}
  # A mesh particle's transform: x22 is the particle, and x2 its location for the transform that follows.
  particle_mesh_place: {address: 0x057B8118, instruction: 0x9100C2C3, resume: false}
  # The same with the camera's offset: the location's x and y loaded into d0, then its z into s2.
  particle_mesh_xy: {address: 0x057B81F8, instruction: 0x0EA0D420, resume: false}
  particle_mesh_z: {address: 0x057B8208, instruction: 0x1E223821, resume: false}
  # GetParticleTransform's own copy, used one particle at a time, on a build that also inlines it in the instance loop
  # (above). This build has the function once, so the routes above serve both paths.
  particle_lone_place: {same_as: particle_mesh_place, resume: false}
  particle_lone_xy: {same_as: particle_mesh_xy, resume: false}
  particle_lone_z: {same_as: particle_mesh_z, resume: false}
  # X19 is the cursor widget; observe the unchanged path only with saved NZCV.Z set.
  cursor_unchanged: {address: 0x021C084C, instruction: 0x540003A0, resume: false}
  # Both viewport floats and the zero margins have been stored; X19 is still the widget.
  cursor_written: {address: 0x021C0864, instruction: 0xB40002F4, resume: false}
