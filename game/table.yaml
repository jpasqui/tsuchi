  ui_settings_dispatch: {object: 19, action: 20, no_action: 8}
  scene_publish: {task: 20}
  # z: x0-x30 as 0-30 (a float's bits), v0-v31 as 32-63 (lane 0; see route_frame_either); the others are vector registers.
  particle_sprite: {z: 8, location: 3, old: 1, old_z: 2}
  particle_mesh_place: {particle: 22, location_pointer: 2}
  particle_mesh_xy: {particle: 22, xy: 0}
  particle_mesh_z: {particle: 22, z: 2}
  particle_lone_place: {particle: 22, location_pointer: 2}
  particle_lone_xy: {particle: 22, xy: 0}
  particle_lone_z: {particle: 22, z: 2}
  # `component` is the cursor update's register for its component. Here the route is inside the placement, which
  # saved that register and the update's widget at saved_component and saved_widget; a build without those has the
  # route where the placement returns to the update, with both still in the update's registers.
  cursor_written: {widget: 19, component: 19, saved_widget: 0x60, saved_component: 0x68, saved_return: 0x78, projected: 0xC0, frame_end: 0xCC}
  dialog_setup_call: {request: 24}

