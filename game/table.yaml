# The game table: every address and offset the framework uses, and nothing else does.
# An entry is added when code first needs it. Addresses are from the start of the
# game's code. The format is described in tools/gen/game_table.py. These are one build's values:
# game/builds/ has other builds' for the same names.
game: Pikmin 4
version: "1.1.1"
key: "1.1.1"                                  # how the framework, its patch files and manifests name this build
build_id: 060F827BD2B38703E9EA11E3210D89BC   # of the game's code, as patch files name it

# Numbers the compiler needs: each stays a constant, and has to be the same in every build. Only generic
# containers of the engine and numbers the framework itself owns belong here, never a gameplay layout.
fixed:
  constants: [native_jump_offset, dynamic_hook_slots, player_slots]
  structs: [array, text_value, enum_name, frozen_name]

# The constants that are addresses, the only ones a build can lack. The others are flags, counts, and sizes,
# which the framework reads as numbers of every build.
address_constants: [ordinary_end_play, ordinary_unregister, ordinary_destroyed, removal_unregister_return, fix_delta, camera_subject, input_resolver, instance_drawer_table]

# Names a build file may change. A build gives exactly these under `names`.
build_names: [game_container, shader_format]

# The framework starts only on a game whose code matches all of these.
identity:
  - {offset: 0x1000, hash: 0x7495E1CF140F2DF4}
  - {offset: 0x3A3D6D0, hash: 0x7EF023F9F8532331}
  - {offset: 0x548C4B0, hash: 0x576D0D50EFC86ADE}
  - {offset: 0x3405610, hash: 0x12E47DB99BCCB5CC}

data:
  options_direction_delegate_table: 0x8AA2518   # the function table of the Options menu's Up and Down handler
  options_input_delegate_table: 0x8AA2588       # and of its Confirm and Back handlers
  dialog_answer_yes: 0x93514C0                 # the names the game's dialogs answer with: the first button
  dialog_answer_no: 0x93514C8                  # the second
  dialog_answer_cancel: 0x93514D0              # the third
  dialog_answer_return: 0x93514E0              # Back
  dialog_result_table: 0x89C07B8               # the function table of the message that ends a dialog
  dialog_result_header: 0x7F19FE8              # the 8 bytes that message carries, as the game makes it
  title_direction_delegate_table: 0x8AA75D8      # and of its Up and Down handler
  title_input_delegate_table: 0x8AA7648          # the function table of the title presenter's Confirm and Back handlers
  wwise_audio_manager: 0x92DD0E8
  wwise_parameter_manager: 0x92DD120
  ui_select_sound: 0x9335ae0 # native common UI focus FName, initialized as Select
  console_manager: 0x97f37d8
  pikmin_ai_class: 0x93768D8
  pikmin_component_class: 0x93A8D48
  object_chunks: 0x98555F0          # pointer to the array of object-table chunks
  object_count: 0x9855604           # objects in the table
  object_serial_counter: 0x9855700  # last serial number given to an object
  name_blocks: 0x983B668            # array of pointers to name blocks
  allocator: 0x981E340              # pointer to the engine's memory allocator
  game_framework: 0x9350BB8         # pointer to the object that runs the game: its actors, clock and rules
  game_context: 0x9340E50           # pointer to what the game keeps from one level to the next: its rule, its stages, its players
  pikmin_scatter_config: 0x9350560  # native restore scatter configuration
  pikmin_scatter_override: 0x9350568
  game_instance: 0x934B538          # pointer to the object that lasts for the whole run: saves, scenes, pauses
  world: 0x9FC3AC8                  # pointer to the loaded world
  random_stream: 0x9375388          # the four numbers of the random stream that play draws on
  pause_manager_table: 0x89D3468    # the function table that says an object is the pause manager
  save_async_state: 0x934F010       # each of these three bytes is nonzero while a save is being read or written
  save_mounted: 0x93502A1
  engine_save_mounted: 0x93BDE28
  # Function tables that tell what a thing is: the queue of messages an actor is sent, and three kinds of message.
  message_queue_table: 0x89AB878
  damage_message_table: 0x89AA3C8
  knock_message_table: 0x88A5448
  whistle_message_table: 0x89AB800
  charge_order_table: 0x8953038     # and a captain's charge order, which a build that inlines its constructor stores itself
  revive_request_table: 0x88D7920   # and a defeated creature's revival request, likewise
  text_manager: 0x97FB690           # pointer to the engine's keeper of text
  text_manager_ready: 0x97FB698     # bit 0 is set once that pointer is good
  game_mode: 0x933AFA8              # pointer to the settings of how the game was started
  portal_part_class: 0x93AAF18      # pointer to the class of the part that makes an actor a portal
  # Function tables that tell what a thing is: the level's clock, the story's stage and its stage of plain play.
  clock_table: 0x89BBCE0
  story_flow_table: 0x89C0230
  story_play_table: 0x89C0278
  # The function tables of two requests the story takes: out of a cave, and through a portal.
  leave_request_table: 0x8A196C8
  portal_request_table: 0x89470C0
  sound_system: 0x9334FA0           # pointer to what plays the game's sounds
  creature_group: 0x933DAE8         # the name of the group the game keeps its enemies in
  status_words: 0xA8A4D60           # two unused words after the game's data, where the framework publishes its status
  # The game's pointer to the system's function that opens a file. Once the game has called it, it leads into the
  # system's library.
  system_library_anchor: 0x92D4518
  loader_state: 0x93C2C80           # a byte: nonzero once the engine has started the system's loader of modules
  # Pointers to the two functions the navigation takes and gives back its memory with: (bytes, a hint) and (block).
  nav_allocate: {at: 0x9273100, returns: pointer, args: [i32, i32]}
  nav_release: {at: 0x9273108, args: [pointer]}
  explore_areas: 0x93754C8          # an array of the numbers of the areas the list of areas shows
  # What makes the game's shaders: a pointer to the renderer, and the function table that says an object is it.
  renderer: 0x9E69BF0
  renderer_table: 0x9253618
  # The presenter. The engine, the length of the engine's frame (a double, as most of the game's code asks for
  # it), and the count of the engine's frames.
  engine: 0x9FBF880
  app_delta: 0x8DA9418
  frame_counter: 0x9826550
  # The game's import slots of the system's three readers of a controller's state: a Pro Controller, the console
  # held in the hands, and two Joy-Con held together. Each is (state, controller number).
  input_full_key: {at: 0x92D4030, args: [pointer, const_pointer]}
  input_handheld: {at: 0x92D4020, args: [pointer, const_pointer]}
  input_joy_dual: {at: 0x92D4028, args: [pointer, const_pointer]}
  physics_dynamic_table: 0x87AAF80  # PhysX's NpRigidDynamic, whose pose getter is qualified below

  world_follow_default_name: 0x9320EA0
  world_follow_none_name: 0x9320DD0
  world_follow_move_name: 0x9320DF8
  mod_config_cache: 0x981E328
  mod_config_filename: 0x98264D8
  mod_settings_table: 0x8FBAEC8
  gimmick_door_closed_table: 0x8930ED0
  gimmick_door_open_name: 0x932E218
  gimmick_door_wait_name: 0x932E220
  gimmick_warp_table: 0x8931050
  battle_manager_table: 0x89BCA18
