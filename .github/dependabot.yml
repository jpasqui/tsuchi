version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns: ['*']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    groups:
      python:
        patterns: ['*']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /site
    groups:
      docs:
        patterns: ['*']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
