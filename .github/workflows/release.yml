name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.2.0-rc.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  draft:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsuchi-candidate
          path: build/ci/candidate
      - name: Verify receipt and prepare release notes
        run: python3 tools/ci_package.py --verify build/ci/candidate --tag "$RELEASE_TAG" --notes build/ci/release-notes.md
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" --verify-tag --draft --title "Tsuchi $RELEASE_TAG" --notes-file build/ci/release-notes.md)
          if python3 -c 'import json, sys; from pathlib import Path; sys.exit(not json.loads(Path("build/ci/candidate/provenance.json").read_text(encoding="utf-8"))["prerelease"])'; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" build/ci/candidate/*
