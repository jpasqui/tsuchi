name: Bug report
description: Report a problem in Tsuchi, its SDK, or its documentation.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Give the Tsuchi version or commit and the game's version or build ID.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Host tests or build tools
        - Emulator
        - Console
        - Documentation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include relevant logs, tool versions, installed mods, and screenshots. Remove private paths and personal information. Don't attach game files, saves, or keys.
