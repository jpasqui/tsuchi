service: hud
tutorials:
  - {title: Ask the player, path: /develop/dialog-and-hud/}
layer: game
acts_on: game
lifetime: world
brief: "Shows your text on the game's announcement banner, and the crew's own radio messages."
description: |
  The game shows announcements on a banner that slides across the screen. Use
  this service to show your own text on that banner.

functions:
  - name: banner
    doc: |
      Shows text on the game's announcement banner for a number of seconds. The game
      keeps running while it is shown. The banner appears on the first player's
      screen. A later banner replaces it, and so does one of the game's own
      announcements.
    params:
      - {name: text, type: text, doc: The text to show.}
      - {name: seconds, type: f32, default: 4, doc: "How long it stays on screen, in seconds."}
    fails:
      invalid: "`seconds` isn't greater than `0`, or the text isn't valid UTF-8."
      not_ready: "The game has no banner right now, as no level is being played or the game isn't ready."
    users: [online-coop, dog-coop]

  - name: radio
    doc: |
      Has the crew say one of the game's own radio messages, with its face and voice,
      as the game asks for one: by its label, such as `Pikmin_MassDeath`. The game
      picks one of the label's lines, and shows it after the message it is showing.
      It says nothing when its own rules for the label say no: in a scene, in a mode
      the label isn't for, before or after the story's quests it waits on, while the
      label cools down, or once a label that is said once has been said.
    params:
      - {name: name, type: text, doc: "The label."}
    fails:
      invalid: "The name isn't valid UTF-8, or it is too long for a name."
      not_found: "The game has no message with that label."
      not_ready: "The game has no radio right now, as no level is being played."
    completes: banner

  - name: prompts_shown
    doc: |
      Tells on which players' screens the game shows an action prompt that points
      at an actor, such as Ride over Oatchi. It reads the prompts as the game shows
      them, also while a hold of `hold_hidden_prompts` hides them. The first call
      starts watching the game's prompts and fails with `not_ready`; ask again from
      the next frame on. A prompt whose screen cannot be told counts as the first
      player's.
    params:
      - {name: actor, type: handle<actor>, doc: The actor the prompts point at.}
    returns: {type: u32, doc: "One bit for each player's screen, `1` for the first player's and `8` for the fourth's. `0` when none is shown."}
    fails:
      not_found: "The actor no longer exists."
      not_ready: "Watching the game's prompts has just started, or it cannot start on this game."
    users: [online-coop, dog-coop]

  - name: hold_hidden_prompts
    doc: |
      Hides the game's action prompts that point at an actor, on some players'
      screens, such as Ride over the captain on a screen whose player cannot ride.
      Each prompt is hidden through the engine's own setter of its visibility, on
      every frame the game would show it, and gets the visibility the game gave it
      back when the hold ends. The hold ends when you release it, when the actor
      leaves play, and when your mod stops. Holding the same actor again changes the
      screens.
    owns: true
    params:
      - {name: actor, type: handle<actor>, doc: The actor whose prompts are hidden.}
      - {name: players, type: u32, doc: "One bit for each player's screen it hides them on, `1` for the first player's, `15` for every screen."}
    fails:
      invalid: "`players` is `0` or has a bit above the fourth player's."
      not_found: "The actor no longer exists."
      not_ready: "The game's prompts cannot be watched on this game."
      capacity: "32 holds hide prompts already."
    users: [online-coop, dog-coop]

  - name: release_hidden_prompts
    doc: "Ends your hold that hides an actor's prompts. They are shown again as the game shows them."
    owns: true
    params:
      - {name: actor, type: handle<actor>, doc: The actor.}
    fails:
      not_found: "Your mod has no hold that hides that actor's prompts."
    completes: hold_hidden_prompts
