# A made-up game for the host tests. Its layout is deliberately not any real game's:
# the tests pass only if the framework takes every number from the table.
game: Stand-in
version: "0.0"

# Numbers the compiler needs: each stays a constant, and has to be the same in every build. Only generic
# containers of the engine and numbers the framework itself owns belong here, never a gameplay layout.
fixed:
  constants: [native_jump_offset, player_slots]
  structs: [array, text_value, enum_name, frozen_name]

# Names a build file may change. A build gives exactly these under `names`.
build_names: [game_container, shader_format]


